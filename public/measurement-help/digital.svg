<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300"><title>数显卡尺读数示例</title><rect width="640" height="300" fill="#fff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#245dcb"/></marker></defs><g fill="#34465b" stroke-linejoin="round" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17"><text x="30" y="35" >读完整数字，同时核对屏幕单位</text><rect x="140" y="67" width="360" height="150" fill="#edf1f5" stroke="#34465b" stroke-width="2"/><rect x="170" y="87" width="300" height="87" rx="3" fill="#fff" stroke="#34465b" stroke-width="2"/><text x="195" y="149" font-family="Consolas,monospace" font-size="53">12.35</text><text x="422" y="145" fill="#245dcb" font-size="24">mm</text><circle cx="210" cy="196" r="10" fill="#fff" stroke="#34465b"/><circle cx="323" cy="196" r="10" fill="#fff" stroke="#34465b"/><text x="230" y="202" font-size="14">归零</text><text x="342" y="202" font-size="14">mm / in</text><text x="320" y="254" text-anchor="middle">示例：12.35 mm，不是本项尺寸</text><text x="320" y="282" text-anchor="middle" font-size="15">测前检查零位，不要夹着零件归零</text></g></svg>