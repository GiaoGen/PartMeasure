<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PartMeasure 标注工具提案</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#23364b;font:16px/1.65 system-ui,'Microsoft YaHei',sans-serif}main{max-width:1100px;margin:auto;padding:32px 20px}h1{font-size:28px;margin:0 0 8px}p{color:#607286}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}button{font:inherit;border:1px solid #c9d4df;background:#fff;color:#23364b;padding:9px 18px;border-radius:7px;cursor:pointer}button[aria-pressed=true]{background:#2564a8;color:white;border-color:#2564a8}button:focus-visible,input:focus-visible{outline:3px solid #8aadd6;outline-offset:3px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:28px}figure{margin:0;min-width:0}svg{display:block;width:100%;background:white;border:1px solid #d9e0e7;border-radius:10px}figcaption{margin-top:16px;color:#607286}aside{border-left:1px solid #d9e0e7;padding-left:24px}h2{font-size:20px;margin-top:0}label{display:block;margin-bottom:18px}input{display:block;width:100%;font:inherit;padding:10px;margin-top:6px;border:1px solid #bdcbd8;border-radius:6px}small{display:block;color:#607286}footer{border-top:1px solid #d9e0e7;margin-top:32px;padding-top:18px;color:#607286}#status{color:#2564a8;min-height:28px}@media(max-width:700px){main{padding:20px 16px}.layout{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid #d9e0e7;padding:18px 0 0}nav button{flex:1;padding:9px 12px}}
</style><main><h1>照片标注：先看显示效果</h1><p>独立提案。选择图形，填写或清空人工值；不会创建或提交真实标注。</p><nav aria-label="图形示例"><button type="button" data-tool="line" aria-pressed="false">线段</button><button type="button" data-tool="angle" aria-pressed="false">角度</button><button type="button" data-tool="arc" aria-pressed="false">圆弧</button><button type="button" data-tool="ellipse" aria-pressed="false">椭圆</button></nav><div class="layout"><figure><svg viewBox="0 0 580 295" role="img" aria-label="所选图形的尺寸标注示例"><defs><marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="none" stroke="#2564a8" stroke-width="1.5"/></marker></defs><g id="shape" transform="translate(0 28)"></g><g id="labels" transform="translate(0 28)"></g></svg><figcaption id="hint"></figcaption></figure><aside><h2>标注与属性</h2><div id="fields"></div><p id="status" role="status"></p><button id="fill" type="button">填入示例人工值</button> <button id="clear" type="button">全部留空</button><small>这里的输入只改变示意图。实际产品的客户提交、工程师确认和历史记录尚未接入本示例。</small></aside></div><footer>OpenCV 目前未实现。此提案不增加识别管线、后端服务或网络请求。<br>照片中的夹角/像素长度不代表实物尺寸；椭圆也不能自动还原斜拍圆孔的孔径。<br><a href="annotation-tools.png">查看四种示例总图</a> · <a href="README.md">完整方案</a></footer></main><script>
const samples={"line":{"title":"线段","hint":"两点定位。端标随线垂直，不画长引出线。","fields":["长度"],"unit":"mm","values":["120"],"shape":"<path d=\"M70 220V162H150V142H440V162H510V220\" fill=\"#e7ebef\" stroke=\"#b4bec9\" stroke-width=\"2\"/><line x1=\"100\" y1=\"100\" x2=\"480\" y2=\"100\" stroke=\"#2564a8\" stroke-width=\"2\" marker-start=\"url(#arrow)\" marker-end=\"url(#arrow)\"/><line x1=\"100\" y1=\"93\" x2=\"100\" y2=\"107\" stroke=\"#2564a8\" stroke-width=\"2\" /><line x1=\"480\" y1=\"93\" x2=\"480\" y2=\"107\" stroke=\"#2564a8\" stroke-width=\"2\" />","labels":[{"x":290,"y":81,"key":0,"prefix":"","pending":"长度待补"}]},"angle":{"title":"角度","hint":"顶点 → 第一条边 → 第二条边；真实角度由人填写。","fields":["角度"],"unit":"°","values":["45"],"shape":"<path d=\"M145 215L145 192L335 12L350 30L175 205H490V225H145Z\" fill=\"#e7ebef\" stroke=\"#b4bec9\" stroke-width=\"2\"/><line x1=\"160\" y1=\"200\" x2=\"455\" y2=\"200\" stroke=\"#2564a8\" stroke-width=\"2\" /><line x1=\"160\" y1=\"200\" x2=\"310\" y2=\"50\" stroke=\"#2564a8\" stroke-width=\"2\" /><path d=\"M240 200A80 80 0 0 0 216.569 143.431\" fill=\"none\" stroke=\"#2564a8\" stroke-width=\"2\"/><circle cx=\"160\" cy=\"200\" r=\"4\" fill=\"#fff\" stroke=\"#2564a8\" stroke-width=\"2\"/><circle cx=\"310\" cy=\"50\" r=\"4\" fill=\"#fff\" stroke=\"#2564a8\" stroke-width=\"2\"/><circle cx=\"455\" cy=\"200\" r=\"4\" fill=\"#fff\" stroke=\"#2564a8\" stroke-width=\"2\"/>","labels":[{"x":300,"y":155,"key":0,"prefix":"α ","pending":"角度待补"}]},"arc":{"title":"圆弧","hint":"起点 → 弧上中间点 → 终点；默认只要求补半径。","fields":["半径"],"unit":"mm","values":["20"],"shape":"<path d=\"M135 205A155 155 0 0 1 445 205\" fill=\"none\" stroke=\"#c1cad4\" stroke-width=\"16\"/><path d=\"M150 205A140 140 0 0 1 430 205\" fill=\"none\" stroke=\"#2564a8\" stroke-width=\"2.5\"/><line x1=\"290\" y1=\"205\" x2=\"389\" y2=\"106\" stroke=\"#2564a8\" stroke-width=\"2\" marker-end=\"url(#arrow)\"/><line x1=\"143\" y1=\"205\" x2=\"157\" y2=\"205\" stroke=\"#2564a8\" stroke-width=\"2\" /><line x1=\"423\" y1=\"205\" x2=\"437\" y2=\"205\" stroke=\"#2564a8\" stroke-width=\"2\" /><circle cx=\"150\" cy=\"205\" r=\"4\" fill=\"#fff\" stroke=\"#2564a8\" stroke-width=\"2\"/><circle cx=\"290\" cy=\"65\" r=\"4\" fill=\"#fff\" stroke=\"#2564a8\" stroke-width=\"2\"/><circle cx=\"430\" cy=\"205\" r=\"4\" fill=\"#fff\" stroke=\"#2564a8\" stroke-width=\"2\"/><circle cx=\"290\" cy=\"205\" r=\"2.5\" fill=\"#647487\"/>","labels":[{"x":384,"y":145,"key":0,"prefix":"R","pending":"半径待补"}]},"ellipse":{"title":"椭圆","hint":"贴合斜拍圆孔；默认人工孔径 Ø，可选长半轴 a。","fields":["圆孔直径 Ø"],"unit":"mm","values":["40"],"shape":"<ellipse cx=\"290\" cy=\"145\" rx=\"184\" ry=\"78\" transform=\"rotate(-20 290 145)\" fill=\"#e7ebef\" stroke=\"#bbc5cf\" stroke-width=\"2\"/><ellipse cx=\"290\" cy=\"145\" rx=\"176\" ry=\"70\" transform=\"rotate(-20 290 145)\" fill=\"none\" stroke=\"#2564a8\" stroke-width=\"2\"/>","labels":[{"x":290,"y":145,"key":0,"prefix":"Ø","pending":"孔径待补"}]}};
let current='line',values=[];
const ns='http://www.w3.org/2000/svg',fields=document.getElementById('fields');
function redraw(){const s=samples[current];const labels=document.getElementById('labels');labels.replaceChildren();s.labels.forEach(p=>{const t=document.createElementNS(ns,'text');t.setAttribute('x',p.x);t.setAttribute('y',p.y);t.setAttribute('font-size','20');t.setAttribute('text-anchor','middle');t.setAttribute('fill','#2564a8');t.setAttribute('stroke','white');t.setAttribute('stroke-width','7');t.setAttribute('paint-order','stroke');t.textContent=values[p.key]?p.prefix+values[p.key]+(s.unit==='°'?'°':' mm'):p.pending;labels.append(t)});const missing=values.filter(v=>!v).length;document.getElementById('status').textContent=missing?'示意：还有 '+missing+' 个字段待补':'示意：已填写，真实产品仍按来源确认';}
function select(key){current=key;const s=samples[key];values=s.fields.map(()=> '');document.getElementById('shape').innerHTML=s.shape;document.getElementById('hint').textContent=s.hint;fields.replaceChildren();s.fields.forEach((name,i)=>{const l=document.createElement('label');l.textContent=name+'（'+s.unit+'）';const input=document.createElement('input');input.inputMode='decimal';input.placeholder='留空表示待补';input.maxLength=24;input.addEventListener('input',()=>{values[i]=input.value.trim();redraw()});l.append(input);fields.append(l)});document.querySelectorAll('[data-tool]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tool===key)));redraw()}
document.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.tool)));
document.getElementById('fill').addEventListener('click',()=>{values=[...samples[current].values];fields.querySelectorAll('input').forEach((e,i)=>e.value=values[i]);redraw()});
document.getElementById('clear').addEventListener('click',()=>{values=values.map(()=> '');fields.querySelectorAll('input').forEach(e=>e.value='');redraw()});select('line');
</script></html>
