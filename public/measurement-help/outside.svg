<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300"><title>外测量爪接触位置示意</title><rect width="640" height="300" fill="#fff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#245dcb"/></marker></defs><g fill="#34465b" stroke-linejoin="round" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17"><text x="30" y="35" >较大的外爪，轻夹两侧外表面</text><rect x="120" y="90" width="440" height="26" fill="#edf1f5" stroke="#34465b" stroke-width="2"/><rect x="120" y="82" width="30" height="156" fill="#edf1f5" stroke="#34465b" stroke-width="2"/><rect x="340" y="78" width="40" height="160" fill="#edf1f5" stroke="#34465b" stroke-width="2"/><rect x="150" y="166" width="190" height="62" fill="#dce3eb" stroke="#34465b" stroke-width="2"/><line x1="150" y1="166" x2="150" y2="228" stroke="#245dcb"  stroke-width="5"/><line x1="340" y1="166" x2="340" y2="228" stroke="#245dcb"  stroke-width="5"/><line x1="182" y1="146" x2="308" y2="146" stroke="#245dcb" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="245" y="270" text-anchor="middle">贴合后读数，不要用力挤压</text><text x="449" y="154" text-anchor="middle">主尺</text></g></svg>