<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手机点标注 · 原位弹框设计示例</title><style>body{background:#f7f8fa;color:#1f2933;font:15px/1.6 'Segoe UI','Microsoft YaHei',sans-serif;margin:0;padding:24px}main{max-width:1000px;margin:auto}a{color:#2459b8}.role{display:inline-block;padding:10px 20px;margin:8px;border:1px solid #dce2e8;border-radius:6px;cursor:pointer}#guest:checked~label[for=guest],#owner:checked~label[for=owner]{background:#edf3fc;color:#2459b8}input{accent-color:#2459b8}.phone{position:relative;width:min(430px,100%);aspect-ratio:430/900;background:white;border:1px solid #dce2e8;margin-top:16px}.phone>img,.modal>img{width:100%;height:100%;display:block}.hotspot{position:absolute;left:39%;top:39%;width:26%;height:10%;border:2px dashed #2459b8;border-radius:50%;box-sizing:border-box}.number{left:78%;top:35%;width:9%;height:5%;border-radius:50%}.hint{position:absolute;top:47%;left:9%;padding:4px 8px;background:#fff;font-size:12px;color:#2459b8;pointer-events:none}#guest:checked~.phone .owner-link,#owner:checked~.phone .guest-link{display:none}.modal{display:none;position:absolute;inset:0;z-index:2}.modal:target{display:block}.close{position:absolute;left:84%;top:32.7%;width:11%;height:5%;border-radius:8px}.close-owner{top:20.8%}a:focus-visible{outline:3px solid #2459b8;outline-offset:3px}</style><main><h1>手机图库直接点标注</h1><p>先选角色，再点击照片孔位或编号的虚线热区。展示原位弹框；关闭回到图库。输入与提交仅为静态示意，不连接后端、不保存数据。</p><input type=radio id=guest name=role checked><label class=role for=guest>客户端</label><input type=radio id=owner name=role><label class=role for=owner>工程师端</label><div class=phone id=phone><img src="mobile-materials.png" alt="手机资料图库"><a class="hotspot guest-link" href="#guest-modal" aria-label="点椭圆标注打开客户补齐框"></a><a class="hotspot number guest-link" href="#guest-modal" aria-label="点编号打开客户补齐框"></a><a class="hotspot owner-link" href="#owner-modal" aria-label="点椭圆标注打开工程师属性框"></a><a class="hotspot number owner-link" href="#owner-modal" aria-label="点编号打开工程师属性框"></a><span class=hint>点击孔位或编号 → 原位弹框</span><section class=modal id=guest-modal aria-label="客户补齐弹框设计稿"><img src="guest.png" alt="现有客户补齐框的统一样式方案"><a class=close href="#phone" aria-label="关闭客户补齐框回到图库"></a></section><section class=modal id=owner-modal aria-label="工程师属性弹框设计稿"><img src="owner-mobile.png" alt="保留现有工程师属性能力的弹框方案"><a class="close close-owner" href="#phone" aria-label="关闭工程师属性框回到图库"></a></section></div><p><a href="inbox.png">查看保留的待处理事项排版</a> · <a href="inbox-selected.png">查看同浮窗下方详情</a> · <a href="index.html">全部设计稿</a> · <a href="README.md">方案与功能保留清单</a></p></main></html>
