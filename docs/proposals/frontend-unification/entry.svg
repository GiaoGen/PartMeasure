<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><style>text{font-family:'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif} .num{font-variant-numeric:tabular-nums}</style><rect x="0" y="0" width="1440" height="900" fill="#f7f8fa" stroke="none" rx="0"/><rect x="0" y="0" width="1440" height="900" fill="#ffffff" stroke="none" rx="0"/><rect x="56" y="27" width="24" height="24" fill="#2459b8" stroke="none" rx="5"/><path d="M62 44v-10h6a4 4 0 0 1 0 8h-6" fill="none" stroke="white" stroke-width="2"/><text x="91" y="46" font-size="20" fill="#1f2933" font-weight="600">PartMeasure</text><text x="967" y="46" font-size="13" fill="#526171" font-weight="400">工程师整理 · 客户免注册协作</text><rect x="1248" y="24" width="136" height="36" fill="#2459b8" stroke="#2459b8" rx="6"/><text x="1260" y="47" font-size="14" fill="#ffffff" font-weight="500">工程师登录</text><rect x="56" y="86" width="1328" height="1" fill="#dce2e8" stroke="none" rx="0"/><text x="72" y="170" font-size="14" fill="#2459b8" font-weight="600">工程资料协作</text><text x="72" y="240" font-size="43" fill="#1f2933" font-weight="600">把零件资料，</text><text x="72" y="304" font-size="43" fill="#1f2933" font-weight="600">交接清楚。</text><text x="72" y="359" font-size="17" fill="#526171" font-weight="400">照片、标注、补测与成果版本，放在同一个项目里。</text><text x="72" y="391" font-size="17" fill="#526171" font-weight="400">工程师指出测哪里，客户打开链接即可上传和回复。</text><rect x="72" y="434" width="156" height="36" fill="#2459b8" stroke="#2459b8" rx="6"/><text x="84" y="457" font-size="14" fill="#ffffff" font-weight="500">进入工程师工作台</text><text x="72" y="508" font-size="13" fill="#526171" font-weight="400">客户无需注册，请使用工程师分享的项目链接。</text><rect x="718" y="146" width="666" height="421" fill="#f7f8fa" stroke="#dce2e8" rx="8"/><rect x="718" y="146" width="666" height="43" fill="#ffffff" stroke="#dce2e8" rx="8"/><text x="739" y="173" font-size="13" fill="#2459b8" font-weight="600">资料与补测</text><text x="859" y="173" font-size="13" fill="#526171" font-weight="400