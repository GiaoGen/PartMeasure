<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900"><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif}</style><defs><marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="none" stroke="#2564a8" stroke-width="1.5"/></marker></defs><rect width="1280" height="900" fill="#f3f6f9"/><text x="40" y="53" font-size="30" font-weight="600" fill="#23364b">照片标注 / 显示与操作提案</text><text x="40" y="88" font-size="17" fill="#647487">短端标 + 小箭头；新增角度、圆弧、椭圆。蓝色尺寸均为人工填写的示例。</text><g transform="translate(40 124)"><rect width="580" height="338" rx="12" fill="#fff" stroke="#d9e0e7"/><text x="24" y="38" font-size="22" font-weight="600" fill="#23364b">01 / 线段</text><g transform="translate(0 42)"><path d="M70 220V162H150V142H440V162H510V220" fill="#e7ebef" stroke="#b4bec9" stroke-width="2"/><line x1="100" y1="100" x2="480" y2="100" stroke="#2564a8" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line x1="100" y1="93" x2="100" y2="107" stroke="#2564a8" stroke-width="2" /><line x1="480" y1="93" x2="480" y2="107" stroke="#2564a8" stroke-width="2" /><text x="290" y="81" font-size="20" fill="#2564a8" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="7" stroke-linejoin="round">120 mm</text></g><text x="24" y="312" font-size="15" fill="#647487">两点定位。端标随线垂直，不画长引出线。</text></g><g transform="translate(660 124)"><rect width="580" height="338" rx="12" fill="#fff" stroke="#d9e0e7"/><text x="24" y="38" font-size="22" font-weight="600" fill="#23364b">02 / 角度</text><g transform="translate(0 42)"><path d="M145 215L145 192L335 12L350 30L175 205H490V225H145Z" fill="#e7ebef" stroke="#b4bec9" stroke-width="2"/><line x1="160" y1="200" x2="455" y2="200" stroke="#2564a8" stroke-width="2" /><line x1="160" y1="200" x2="310" y2="50" stroke="#2564a8" stroke-width="2" /><path d="M240 200A80 80 0 0 0 216.569 143.431" fill="none" stroke="#2564a8" stroke-width="2"/><circle cx="160" cy="200" r="4" fill="#fff" stroke="#2564a8" stroke-width="2"/><circle cx="310" cy="50" r="4" fill="#fff" stroke="#2564a8" stroke-width="2"/><circle cx="455" cy="200" r="4" fill="#fff" stroke="#2564a8" stroke-width="2"/><text x="300" y="155" font-size="20" fill="#2564a8" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="7" stroke-linejoin="round">α 45°</text></g><text x="24" y="312" font-size="15" fill="#647487">顶点 → 第一条边 → 第二条边；真实角度由人填写。</text></g><g transform="translate(40 490)"><rect width="580" height="338" rx="12" fill="#fff" stroke="#d9e0e7"/><text x="24" y="38" font-size="22" font-weight="600" fill="#23364b">03 / 圆弧</text><g transform="translate(0 42)"><path d="M135 205A155 155 0 0 1 445 205" fill="none" stroke="#c1cad4" stroke-width="16"/><path d="M150 205A140 140 0 0 1 430 205" fill="none" stroke="#2564a8" stroke-width="2.5"/><line x1="290" y1="205" x2="389" y2="106" stroke="#2564a8" stroke-width="2" marker-end="url(#arrow)"/><line x1="143" y1="205" x2="157" y2="205" stroke="#2564a8" stroke-width="2" /><line x1="423" y1="205" x2="437" y2="205" stroke="#2564a8" stroke-width="2" /><circle cx="150" cy="205" r="4" fill="#fff" stroke="#2564a8" stroke-width="2"/><circle cx="290" cy="65" r="4" fill="#fff" stroke="#2564a8" stroke-width="2"/><circle cx="430" cy="205" r="4" fill="#fff" stroke="#2564a8" stroke-width="2"/><circle cx="290" cy="205" r="2.5" fill="#647487"/><text x="384" y="145" font-size="20" fill="#2564a8" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="7" stroke-linejoin="round">R20 mm</text></g><text x="24" y="312" font-size="15" fill="#647487">起点 → 弧上中间点 → 终点；默认只要求补半径。</text></g><g transform="translate(660 490)"><rect width="580" height="338" rx="12" fill="#fff" stroke="#d9e0e7"/><text x="24" y="38" font-size="22" font-weight="600" fill="#23364b">04 / 椭圆</text><g transform="translate(0 42)"><ellipse cx="290" cy="145" rx="184" ry="78" transform="rotate(-20 290 145)" fill="#e7ebef" stroke="#bbc5cf" stroke-width="2"/><ellipse cx="290" cy="145" rx="176" ry="70" transform="rotate(-20 290 145)" fill="none" stroke="#2564a8" stroke-width="2"/><text x="290" y="145" font-size="20" fill="#2564a8" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="7" stroke-linejoin="round">Ø40 mm</text></g><text x="24" y="312" font-size="15" fill="#647487">拖轴定方向，再调垂直轴；默认孔径 Ø，可选半轴 a。</text></g><text x="40" y="870" font-size="16" fill="#647487">仅独立示意 · 未接入正式编辑器 · 几何用于定位，不从照片推算零件真实尺寸或角度</text></svg>