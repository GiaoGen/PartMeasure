<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1040" viewBox="0 0 1040 1040"><rect width="1040" height="1040" fill="#f5f7fa"/><g fill="#34465b" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17"><text x="35" y="35" font-size="22" font-weight="600">P1-02 · 沿用现有回复区，测量帮助原位展开</text><text x="35" y="64" font-size="14" fill="#627080">设计示例（非运行截图）：左侧默认收起，右侧展开；正式入口待审。</text><g transform="translate(35,90)"><rect width="460" height="440" fill="white" stroke="#d5dae1"/><g transform="translate(24,30)"><text x="0" y="0" font-weight="600">孔径</text><text x="412" y="0" text-anchor="end" fill="#bd3535" font-size="13">待补充</text><text x="0" y="42" fill="#627080" font-size="13">测量方式</text><text x="0" y="70" >内测量爪</text><line x1="0" y1="91" x2="412" y2="91"  stroke-width="2" stroke="#d5dae1"/><text x="0" y="120" fill="#36567f">› 测量帮助</text><g transform="translate(0,150)"><text x="0" y="0" fill="#627080" font-size="13">测量说明</text><text x="0" y="28" font-size="15">测中间孔，避开孔口倒角</text><text x="0" y="76" font-size="14">实测孔径</text><rect y="90" width="328" height="42" rx="6" fill="white" stroke="#cdd5df"/><rect x="336" y="90" width="76" height="42" rx="6" fill="white" stroke="#cdd5df"/><text x="356" y="117" font-size="15">mm</text><text x="0" y="166" font-size="14">› 更多选项</text><rect y="184" width="120" height="44" rx="6" fill="#36567f"/><text x="60" y="212" text-anchor="middle" fill="white" font-size="15">提交补充</text></g></g></g><g transform="translate(545,90)"><rect width="460" height="900" fill="white" stroke="#d5dae1"/><g transform="translate(24,30)"><text x="0" y="0" font-weight="600">孔径</text><text x="412" y="0" text-anchor="end" fill="#bd3535" font-size="13">待补充</text><text x="0" y="42" fill="#627080" font-size="13">测量方式</text><text x="0" y="70" >内测量爪</text><line x1="0" y1="91" x2="412" y2="91"  stroke-width="2" stroke="#d5dae1"/><text x="0" y="120" fill="#36567f">⌄ 测量帮助</text><text x="0" y="158" font-size="15" font-weight="600">内测量爪：轻贴孔内两侧</text><svg x="0" y="172" width="412" height="193" viewBox="0 0 640 300"><g fill="#34465b" stroke-linejoin="round" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17"><text x="30" y="35" >较小的内爪，向外轻贴两侧内壁</text><rect x="145" y="65" width="75" height="105" fill="#dce3eb" stroke="#34465b" stroke-width="2"/><rect x="420" y="65" width="75" height="105" fill="#dce3eb" stroke="#34465b" stroke-width="2"/><rect x="235" y="216" width="250" height="25" fill="#edf1f5" stroke="#34465b" stroke-width="2"/><path d="M220 119H248V216H235V139H220Z M420 119H392V216H405V139H420Z" fill="#edf1f5" stroke="#34465b" stroke-width="2"/><line x1="220" y1="119" x2="220" y2="139" stroke="#245dcb"  stroke-width="5"/><line x1="420" y1="119" x2="420" y2="139" stroke="#245dcb"  stroke-width="5"/><line x1="290" y1="100" x2="229" y2="100" stroke="#245dcb" stroke-width="2" marker-end="url(#arrow)"/><line x1="350" y1="100" x2="411" y2="100" stroke="#245dcb" stroke-width="2" marker-end="url(#arrow)"/><text x="320" y="78" text-anchor="middle">内孔剖面</text><text x="320" y="278" text-anchor="middle">避开孔口倒角，保持测量面贴合</text></g></svg><text x="0" y="392" font-size="14">1. 小爪伸入指定孔位，避开孔口倒角。</text><text x="0" y="423" font-size="14">2. 向外轻贴两壁，不要斜着撑紧。</text><text x="0" y="454" font-size="14">3. 圆孔对正中心，保持位置后读数。</text><line x1="0" y1="477" x2="412" y2="477"  stroke-width="2" stroke="#d5dae1"/><text x="0" y="508" font-size="14">› 数显卡尺怎么读</text><text x="0" y="552" font-size="14">› 游标卡尺怎么读</text><text x="0" y="592" font-size="13" fill="#627080">看不清可传照片；没有工具可选“无法测量”。</text><g transform="translate(0,620)"><text x="0" y="0" fill="#627080" font-size="13">测量说明</text><text x="0" y="28" font-size="15">测中间孔，避开孔口倒角</text><text x="0" y="76" font-size="14">实测孔径</text><rect y="90" width="328" height="42" rx="6" fill="white" stroke="#cdd5df"/><rect x="336" y="90" width="76" height="42" rx="6" fill="white" stroke="#cdd5df"/><text x="356" y="117" font-size="15">mm</text><text x="0" y="166" font-size="14">› 更多选项</text><rect y="184" width="120" height="44" rx="6" fill="#36567f"/><text x="60" y="212" text-anchor="middle" fill="white" font-size="15">提交补充</text></g></g></g></g></svg>